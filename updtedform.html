<!DOCTYPE html>
<html>
<head>
    <title>Styled Form</title>
    <link rel="stylesheet" href="cssbasic.css">

    <style>
        body
  
        {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        form {
            background: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
        }

        input[type="submit"] {
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: darkblue;
        }
    </style>
</head>

<body>

<h2 style="text-align:center;">Registration Form</h2>

<form>
    <label>Full Name:</label>
    <input type="text">

    <label>Email:</label>
    <input type="email">

    <label>Password:</label>
    <input type="password">

    <label>Country:</label>
    <select>
        <option>Nepal</option>
        <option>India</option>
    </select>

    <input type="submit" value="Register">
</form>

</body>
<body>

</body>
</html>
